<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider Show</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#333;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:0 20px;
    flex-direction:column;
}

.container{
    max-width:700px;
    width:100%;
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.1);
    text-align:center;
    margin-top:20px;
}

h1{margin-bottom:20px;color:#444;}

.config{text-align:left;}

label{display:block;margin-top:10px;font-weight:bold;}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:2px solid #ddd;
    border-radius:6px;
}

.transition-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.transition-btn{
    flex:1;
    min-width:100px;
    padding:10px;
    border:2px solid #007bff;
    border-radius:8px;
    background:#fff;
    color:#007bff;
    cursor:pointer;
}

.transition-btn.active{
    background:#007bff;
    color:#fff;
}

.control-row{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    flex-wrap:wrap;
}

.control-buttons button{
    padding:10px 20px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.footer {
    position: absolute;
    bottom: 8px;
    left: 15px;
    right: 15px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;

    white-space: nowrap; /* 🔥 impede quebra de linha */
}

.footer span {
    display: inline; /* 🔥 garante que fique na mesma linha */
    font-size: 12px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
<h1>🎥 Slider Show</h1>

<div class="config">
<label>Selecione até 5 imagens:</label>
<input type="file" id="imageInput" accept="image/*" multiple>

<label>Transição:</label>
<div class="transition-buttons">
    <button type="button" class="transition-btn active" data-value="fade">Fade</button>
    <button type="button" class="transition-btn" data-value="slide">Slide</button>
    <button type="button" class="transition-btn" data-value="zoom">Zoom</button>
    <button type="button" class="transition-btn" data-value="blur">Blur</button>
</div>

<label>Tempo (ms):</label>
<input type="number" id="duration" value="3000" min="1000">

<div class="control-row">
    <div>
        <label>
            <input type="checkbox" id="showControls">
            Mostrar controles
        </label>
    </div>

    <div class="control-buttons">
        <button id="startBtn">▶️ Iniciar</button>
        <button id="pauseBtn">⏸️ Pausar</button>
        <button id="stopBtn">⏹️ Parar</button>
    </div>
</div>
</div>
</div>

<footer class="footer">
© <span id="ano"></span> Departamento de Comunicação e Mídia – IASD Beira Rio – Central
    <span>Conteúdo de uso institucional. Reprodução não autorizada.</span>
</footer>

<script>
/* ===== ELEMENTOS ===== */
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const durationInput = document.getElementById('duration');
const showControlsInput = document.getElementById('showControls');
const imageInput = document.getElementById('imageInput');
const anoSpan = document.getElementById('ano');

/* ===== ESTADO ===== */
let files = [];
let win = null;

/* ===== ANO ===== */
anoSpan.textContent = new Date().getFullYear();

/* ===== TRANSIÇÕES ===== */
const transitionButtons = document.querySelectorAll('.transition-btn');

transitionButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        transitionButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

const getTransition = () =>
    document.querySelector('.transition-btn.active')?.dataset.value || 'fade';

/* ===== INPUT ===== */
imageInput.addEventListener('change', e => {
    files = [...e.target.files].slice(0, 5);
});

/* ===== SLIDESHOW ===== */
function openShow() {
    if (!files.length) {
        alert('Selecione imagens!');
        return;
    }

    if (win && !win.closed) win.close();

    let duration = parseInt(durationInput.value);
    if (isNaN(duration) || duration < 1000) duration = 3000;

    const transition = getTransition();
    const showControls = showControlsInput.checked;

    win = window.open('', '_blank');
    const doc = win.document;

    const urls = files.map(f => URL.createObjectURL(f));

    const html = `
    <html>
    <body style="margin:0;background:black;overflow:hidden">

    ${urls.map((u,i)=>`
        <img src="${u}" class="${i===0?'active':''} ${transition}">
    `).join('')}

    <style>
    img{
        position:absolute;
        width:100%;
        height:100%;
        object-fit:cover;
        opacity:0;
        transition:all 1s;
    }
    img.active{opacity:1;}
    img.slide{transform:translateX(100%);}
    img.active.slide{transform:translateX(0);}
    img.zoom{transform:scale(1.2);}
    img.active.zoom{transform:scale(1);}
    img.blur{filter:blur(10px);}
    img.active.blur{filter:blur(0);}
    </style>

    <script>
    let slides=document.querySelectorAll('img');
    let i=0;
    let paused=false;

    function next(){
        slides[i].classList.remove('active');
        i=(i+1)%slides.length;
        slides[i].classList.add('active');
    }

    function loop(){
        if(!paused) next();
        setTimeout(loop, ${duration});
    }

    window.togglePause=()=>paused=!paused;

    ${showControls?`
    const c=document.createElement('div');
    c.style="position:fixed;top:10px;right:10px";

    const p=document.createElement('button');
    p.textContent='⏸️';
    p.onclick=()=>{
        paused=!paused;
        p.textContent=paused?'▶️':'⏸️';
    };

    const s=document.createElement('button');
    s.textContent='⏹️';
    s.onclick=()=>window.close();

    c.appendChild(p);
    c.appendChild(s);
    document.body.appendChild(c);
    `:''}

    window.onbeforeunload=()=>{
        ${urls.map(u=>`URL.revokeObjectURL("${u}")`).join(';')}
    };

    loop();
    <\/script>

    </body>
    </html>
    `;

    doc.open();
    doc.write(html);
    doc.close();
}

/* ===== BOTÕES ===== */
startBtn.addEventListener('click', openShow);

pauseBtn.addEventListener('click', () => {
    if (win && !win.closed && typeof win.togglePause === 'function') {
        win.togglePause();
    }
});

stopBtn.addEventListener('click', () => {
    if (win && !win.closed) win.close();
});
</script>

</body>
</html>
