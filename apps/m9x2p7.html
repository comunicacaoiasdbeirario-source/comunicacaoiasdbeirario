<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Informativo Mundial das Missões 2026</title>

<style>
:root {
    --primary-color: #007bff;
    --secondary-color: #f8f9fa;
    --card-bg: #ffffff;
    --text-color: #333;
    --border-color: #ddd;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--secondary-color);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 1200px;
}

h1 {
    text-align: center;
    color: var(--primary-color);
}

#search {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}

#lista {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    list-style: none;
    padding: 0;
}

li {
    background: var(--card-bg);
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

a {
    text-decoration: none;
    color: var(--text-color);
    font-weight: bold;
}

.footer {
    position: absolute;
    bottom: 8px;
    left: 15px;
    right: 15px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;

    white-space: nowrap; /* 🔥 impede quebra de linha */
}

.footer span {
    display: inline; /* 🔥 garante que fique na mesma linha */
    font-size: 12px;
    opacity: 0.8;
}

#no-results {
    display: none;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h1>🌍 Informativo Mundial das Missões - 2026</h1>

    <input 
        type="text" 
        id="search" 
        placeholder="🔍 Buscar vídeos..."
        aria-label="Buscar vídeos"
    >

    <ul id="lista"></ul>
    <p id="no-results">Nenhum resultado encontrado</p>
</div>

<footer class="footer">
     © <span id="ano"></span> Departamento de Comunicação e Mídia – IASD Beira Rio – Central
    <span>Conteúdo de uso institucional. Reprodução não autorizada.</span>
</footer>

<script>
/* ==========================
   📦 DADOS (isolado)
========================== */
const videos = [
    { data: "03/Jan", url: "https://www.youtube.com/watch?v=QgS35LyvUIM" },
    { data: "10/Jan", url: "https://www.youtube.com/watch?v=LxWSUn3s2eE" },
    { data: "17/Jan", url: "https://www.youtube.com/watch?v=q3kixwdX-yA" },
    { data: "24/Jan", url: "https://www.youtube.com/watch?v=J02TFSvnmEY" },
    { data: "31/Jan", url: "https://www.youtube.com/watch?v=36hhFD3bAw4" },
    { data: "07/Fev", url: "https://www.youtube.com/watch?v=5ImkWRw0ywk" },
    { data: "14/Fev", url: "https://www.youtube.com/watch?v=3dkzjz7fHEY" },
    { data: "21/Fev", url: "https://www.youtube.com/watch?v=2IDkZPQ137c" },
    { data: "28/Fev", url: "https://www.youtube.com/watch?v=CKXZHykXLfs" },
    { data: "07/Mar", url: "https://www.youtube.com/watch?v=K-jeVfznHfg" },
    { data: "14/Mar", url: "https://www.youtube.com/watch?v=B8fvULkVuR4" },
    { data: "21/Mar", url: "https://www.youtube.com/watch?v=lXVWcPGONbk" },
    { data: "28/Mar", url: "https://www.youtube.com/watch?v=t41xOEkVXv0" },
    { data: "04/Abr", url: "https://www.youtube.com/watch?v=u28KiUTVGq4" },
    { data: "11/Abr", url: "https://www.youtube.com/watch?v=QGWBiVS067U" },
    { data: "18/Abr", url: "https://www.youtube.com/watch?v=yUrm-rXAyuM" },
    { data: "25/Abr", url: "https://www.youtube.com/watch?v=7peHisAk_8M" }
];


/* ==========================
   ⚙️ UTIL
========================== */
const normalizar = txt =>
    txt.toLowerCase()
       .normalize("NFD")
       .replace(/[\u0300-\u036f]/g, "");

const debounce = (fn, delay) => {
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
};


/* ==========================
   🎨 RENDER (UI)
========================== */
const lista = document.getElementById("lista");

const itens = videos.map((video, i) => {
    const li = document.createElement("li");

    const texto = `${i + 1}. ${video.data} - Informativo Mundial das Missões`;

    const a = document.createElement("a");
    a.href = video.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer"; // 🔐 segurança
    a.textContent = texto;

    li.appendChild(a);
    lista.appendChild(li);

    return {
        element: li,
        textoNormalizado: normalizar(texto)
    };
});


/* ==========================
   🔍 BUSCA (otimizada)
========================== */
const input = document.getElementById("search");
const noResults = document.getElementById("no-results");

const filtrar = () => {
    const termo = normalizar(input.value);
    let count = 0;

    for (const item of itens) {
        const match = item.textoNormalizado.includes(termo);
        item.element.style.display = match ? "" : "none";
        if (match) count++;
    }

    noResults.style.display = count === 0 ? "block" : "none";
};

input.addEventListener("input", debounce(filtrar, 150));


/* ==========================
   📅 ANO
========================== */
document.getElementById("ano").textContent = new Date().getFullYear();

</script>

</body>
</html>
