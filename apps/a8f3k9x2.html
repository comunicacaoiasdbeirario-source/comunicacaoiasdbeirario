<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gestão de Louvor</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{
    --primary:#00bcd4;
    --primary-dark:#0097a7;
    --accent:#ff9800;
    --bg:#f4f4f4;
    --card:#fff;
    --text:#222;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

body.dark{
    --bg:#222;
    --card:#333;
    --text:#f4f4f4;
}

/* HEADER */
.header{
    position:fixed;
    top:10px;
    left:10px;
    display:flex;
    gap:12px;
    z-index:10;
}

.header img{height:50px}
.program-name{font-size:18px;font-weight:700}

/* LINHA */
.linha-full{
    width:100%;
    height:2px;
    background:var(--text);
    margin-top:70px;
}

/* CONTAINER */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin:20px;
    padding-bottom:120px;
}

.thumbnail{
    border:2px solid #ccc;
    padding:8px;
    background:var(--card);
    width:160px;
    text-align:center;
    cursor:pointer;
    border-radius:8px;
    position:relative;
    transition:.2s;
}

.thumbnail:hover{transform:scale(1.05);}

.thumbnail img,
.thumbnail video,
.thumbnail audio{
    max-width:100%;
    max-height:100px;
    margin-bottom:6px;
}

.caption{font-size:12px}

.change-btn{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:5px;
    font-size:12px;
    cursor:pointer;
}

/* MENU */
.menu-floating{
    position:fixed;
    top:10px;
    right:10px;
    z-index:20;
}

.menu-icon{
    width:40px;
    height:40px;
    background:var(--primary);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.menu-panel{
    margin-top:10px;
    width:0;
    max-height:0;
    overflow:hidden;
    background:var(--card);
    border-radius:12px;
    transition:.3s;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu-panel.open{
    width:260px;
    max-height:700px;
    padding:12px;
}

.menu-panel label{
    font-size:14px;
    display:flex;
    gap:6px;
}

.menu-panel input{padding:6px}

.menu-panel button{
    padding:8px;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:6px;
    display:flex;
    gap:6px;
    justify-content:center;
    cursor:pointer;
}

.menu-panel button:hover{
    filter:brightness(1.1);
}

/* RODAPÉ */
.footer{
    position:absolute;
    bottom:8px;
    left:15px;
    right:15px;
    text-align:center;
    font-size:12px;
    color:#6b7280;
    white-space:nowrap;
}

.footer span{
    display:inline;
    font-size:12px;
    opacity:.8;
}

/* CURSOR */
.menu-panel button,
.menu-panel label,
.menu-panel input,
.menu-icon{
    cursor:pointer;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu-floating">
    <div class="menu-icon" id="menuToggle">
        <span class="material-icons">settings</span>
    </div>

    <div class="menu-panel" id="menuPanel">
        <label><span class="material-icons">tune</span> Limite de Thumbs:</label>
        <input type="number" id="thumbLimit" min="1" max="100">

        <button onclick="updateLimit()">
            <span class="material-icons">save</span> Salvar Limite
        </button>

        <button onclick="fileInput.click()">
            <span class="material-icons">add_circle</span> Adicionar
        </button>

        <button onclick="clearFiles()">
            <span class="material-icons">delete</span> Limpar
        </button>

        <button onclick="toggleTheme()">
            <span class="material-icons">dark_mode</span> Tema Escuro
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="header">
<img src="https://tse4.mm.bing.net/th/id/OIP.NmQ4v7h2GqGw3kL_03u9IAHaHa">
<div class="program-name">Gestão de Louvor</div>
</div>

<div class="linha-full"></div>

<div class="container" id="container"></div>

<input type="file" id="fileInput"
style="display:none"
accept="image/*,video/*,audio/*"
onchange="handleFileUpload(event)">

<footer class="footer">
 © <span id="ano"></span> Departamento de Comunicação e Mídia – IASD Beira Rio – Central
 <span>Conteúdo de uso institucional. Reprodução não autorizada.</span>
</footer>

<script>
let MAX_FILES = parseInt(localStorage.getItem('thumbLimit')) || 14;

const container = document.getElementById("container");
const fileInput = document.getElementById("fileInput");
const thumbInput = document.getElementById("thumbLimit");
const menuPanel = document.getElementById("menuPanel");
const menuToggle = document.getElementById("menuToggle");

document.getElementById("ano").textContent = new Date().getFullYear();

thumbInput.value = MAX_FILES;

/* MENU TOGGLE */
menuToggle.onclick = () => {
    menuPanel.classList.toggle("open");
};

/* FECHAR MENU AO CLICAR FORA */
document.addEventListener("click", (e) => {
    if (!menuPanel.contains(e.target) && !menuToggle.contains(e.target)) {
        menuPanel.classList.remove("open");
    }
});

/* LIMITE */
function updateLimit(){
    const value = parseInt(thumbInput.value);
    if(value >= 1 && value <= 100){
        MAX_FILES = value;
        localStorage.setItem("thumbLimit", value);
        alert("Limite atualizado: " + value);
    }
}

/* TEMA */
function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
}

/* LIMPAR */
function clearFiles(){
    container.querySelectorAll("img,video,audio").forEach(el=>{
        if(el.src?.startsWith("blob:")){
            URL.revokeObjectURL(el.src);
        }
    });
    container.innerHTML = "";
}

/* UPLOAD */
function handleFileUpload(e){
    const file = e.target.files[0];
    if(!file) return;

    if(container.children.length >= MAX_FILES){
        alert("Limite atingido!");
        return;
    }

    createThumb(file);
    fileInput.value = "";
}

/* OPEN FILE (FIX TOTAL) */
function openFile(file){
    const url = URL.createObjectURL(file);

    const w = window.open("", "_blank");
    if(!w){
        alert("Ative popups no navegador");
        return;
    }

    const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}
video,audio,img{max-width:100%;max-height:100%}
</style>
</head>
<body>

${
file.type.startsWith("video")
? `<video id="p" src="${url}" controls autoplay muted></video>`
: file.type.startsWith("audio")
? `<audio id="p" src="${url}" controls autoplay></audio>`
: `<img id="p" src="${url}">`
}

<script>
const p=document.getElementById("p");

function fs(){
 try{
  (p.requestFullscreen||p.webkitRequestFullscreen||p.msRequestFullscreen).call(p);
 }catch(e){}
}

if(p && p.tagName==="VIDEO"){
 p.play().catch(()=>{});
}

setTimeout(fs,500);
p?.addEventListener("click",fs,{once:true});
<\/script>

</body>
</html>`;

    w.document.open();
    w.document.write(html);
    w.document.close();
}

/* THUMB */
function createThumb(file){
    const div = document.createElement("div");
    div.className = "thumbnail";

    const url = URL.createObjectURL(file);

    let media;

    if(file.type.startsWith("image")){
        media = document.createElement("img");
        media.src = url;
    }
    else if(file.type.startsWith("video")){
        media = document.createElement("video");
        media.src = url;
        media.muted = true;
    }
    else{
        media = document.createElement(file.type.startsWith("audio") ? "audio" : "div");
        if(media.tagName !== "DIV") media.src = url;
        if(media.controls !== undefined) media.controls = true;
    }

    div.appendChild(media);

    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = file.name;
    div.appendChild(cap);

    const btn = document.createElement("button");
    btn.className = "change-btn";
    btn.textContent = "Alterar";

    btn.onclick = (e)=>{
        e.stopPropagation();
        const inp = document.createElement("input");
        inp.type="file";

        inp.onchange = ev=>{
            const nf = ev.target.files[0];
            if(nf){
                container.replaceChild(createThumb(nf), div);
                URL.revokeObjectURL(url);
            }
        };

        inp.click();
    };

    div.onclick = ()=>openFile(file);

    container.appendChild(div);
    return div;
}
</script>
</body>
</html>
