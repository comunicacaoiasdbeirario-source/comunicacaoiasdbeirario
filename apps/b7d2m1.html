<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciador de Áudios e Vídeos</title>

<style>
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:#f5f5f5;
  color:#1f1f1f;
  margin:0;
  padding:20px;
}

h2{text-align:center;margin-bottom:20px;}

#folderInput{
  display:block;
  margin:0 auto 30px;
  padding:12px 20px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#ffffff;
  color:#1f1f1f;
  font-size:16px;
  cursor:pointer;
}

#mediaContainer{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.media-item{
  position:relative;
  animation:fadeIn .8s forwards;
  opacity:0;
  background:#fff;
  padding:10px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

video,audio{
  width:100%;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#modal video{width:80%;max-height:90vh;}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* RODAPÉ */
.footer {
    position: absolute;
    bottom: 8px;
    left: 15px;
    right: 15px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;

    white-space: nowrap; /* 🔥 impede quebra de linha */
}

.footer span {
    display: inline; /* 🔥 garante que fique na mesma linha */
    font-size: 12px;
    opacity: 0.8;
}

/* MENU */
.dropdown{
  position:fixed;
  top:20px;
  right:20px;
  z-index:50;
}

.dropdown-button{
  background:#ffffff;
  color:#1f1f1f;
  border:1px solid #ddd;
  padding:10px 14px;
  border-radius:6px;
  cursor:pointer;
}

.dropdown-content{
  display:none;
  position:absolute;
  top:45px;
  right:0;
  background:#ffffff;
  border-radius:6px;
  min-width:200px;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
}

.dropdown-content a{
  display:block;
  padding:10px 14px;
  color:#1f1f1f;
  text-decoration:none;
  font-size:13px;
}

.dropdown-content a:hover{
  background:#f0f0f0;
}

.dropdown.show .dropdown-content{
  display:block;
}
</style>
</head>

<body>

<h2>🎵 Gerenciador de Áudio e Vídeo 🎬</h2>

<!-- 🔥 CORREÇÃO PRINCIPAL AQUI -->
<input type="file" id="folderInput" multiple>

<div id="mediaContainer"></div>

<!-- MODAL -->
<div id="modal">
  <video id="modalVideo" controls></video>
</div>

<!-- MENU -->
<div class="dropdown" id="dropdownMenu">
  <button class="dropdown-button">☰ Menu</button>
  <div class="dropdown-content">
    <a href="#" id="addFileBtn">➕ Adicionar arquivo</a>
    <a href="#" id="clearMediaBtn">🗑️ Limpar tudo</a>
    <a href="#">🎞️ Somente vídeos</a>
    <a href="#">🎧 Somente áudios</a>
   <!--  <a href="#">ℹ️ Sobre</a> -->
  </div>
</div>

<input type="file" id="menuFileInput" multiple style="display:none">

<footer class="footer">
    © <span id="ano"></span> Departamento de Comunicação e Mídia – IASD Beira Rio – Central
    <span>Conteúdo de uso institucional. Reprodução não autorizada.</span>
</footer>

<script>
document.getElementById("ano").textContent = new Date().getFullYear();

const mediaContainer = document.getElementById("mediaContainer");
const modal = document.getElementById("modal");
const modalVideo = document.getElementById("modalVideo");
const folderInput = document.getElementById("folderInput");
const menuFileInput = document.getElementById("menuFileInput");
const dropdown = document.getElementById("dropdownMenu");

const activeUrls = new Set();

/* VALIDAÇÃO */
function isValidMedia(file){
  return file.type.startsWith("video") || file.type.startsWith("audio");
}

/* ADD ARQUIVO */
function addFile(file){
  if(!isValidMedia(file)) return;

  const url = URL.createObjectURL(file);
  activeUrls.add(url);

  const wrap = document.createElement("div");
  wrap.className = "media-item";
  wrap.dataset.url = url;

  const label = document.createElement("p");
  label.textContent = file.name;

  let media;

  if(file.type.startsWith("video")){
    media = document.createElement("video");
    media.controls = true;
    media.src = url;

    media.addEventListener("click", () => {
      modalVideo.src = url;
      modal.style.display = "flex";
      modalVideo.play();
    });

  } else {
    media = document.createElement("audio");
    media.controls = true;
    media.src = url;
  }

  wrap.appendChild(label);
  wrap.appendChild(media);

  mediaContainer.appendChild(wrap);
}

/* SUPORTE A ARQUIVO OU PASTA */
folderInput.addEventListener("change", e => {
  clearMedia(false);
  [...e.target.files].forEach(addFile);
});

/* MODAL CLOSE */
function closeModal(){
  modal.style.display = "none";
  modalVideo.pause();
  modalVideo.src = "";
  modalVideo.load();
}

modal.addEventListener("click", e => {
  if(e.target === modal){
    closeModal();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){
    closeModal();
  }
});

/* MENU */
dropdown.querySelector(".dropdown-button")
.addEventListener("click", e=>{
  e.stopPropagation();
  dropdown.classList.toggle("show");
});

document.addEventListener("click", () => {
  dropdown.classList.remove("show");
});

/* ADD MENU */
document.getElementById("addFileBtn")
.addEventListener("click", e=>{
  e.preventDefault();
  menuFileInput.click();
});

menuFileInput.addEventListener("change", e=>{
  [...e.target.files].forEach(addFile);
  menuFileInput.value = "";
});

/* LIMPAR */
function clearMedia(showConfirm = true){
  if(showConfirm){
    const ok = confirm("Tem certeza que deseja limpar tudo?");
    if(!ok) return;
  }

  document.querySelectorAll(".media-item").forEach(el=>{
    const url = el.dataset.url;
    if(url){
      URL.revokeObjectURL(url);
      activeUrls.delete(url);
    }
  });

  mediaContainer.innerHTML = "";
  closeModal();
}

document.getElementById("clearMediaBtn")
.addEventListener("click", e=>{
  e.preventDefault();
  clearMedia(true);
});
</script>

</body>
</html>
